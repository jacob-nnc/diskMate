// ===== 键盘：对齐 Windows 资源管理器 =====
// ↑↓ 移动选中 / ←→ 折叠展开 / Enter 打开 / Backspace 上级
// Ctrl+A 全选 / Ctrl+C X V 复制剪切粘贴 / F2 重命名 / Delete 删除 / Shift+Delete 永久删除
// 文件操作走系统壳命令（宿主 cmd:"shell"），因为是 WebView2，JS 不能直接动文件系统。
function focusRow() {
  let i = state.rows.findIndex(r => r.node.id === state.selectedId);
  return i < 0 ? -1 : i;
}
function ensureVisible(i) {
  const top = i * ROW_H, bot = top + ROW_H;
  if (top < listEl.scrollTop) listEl.scrollTop = top;
  else if (bot > listEl.scrollTop + listEl.clientHeight)
    listEl.scrollTop = bot - listEl.clientHeight;
}
function moveSel(delta) {
  const n = state.rows.length;
  if (!n) return;
  let i = focusRow();
  if (i < 0) i = delta > 0 ? -1 : n;
  i = Math.max(0, Math.min(n - 1, i + delta));
  selectRow(i, {});
  ensureVisible(i);
}
function toggleExpand(i, wantOpen) {
  const r = state.rows[i];
  if (!r || !r.hasKids) return;
  const id = r.node.id;
  const isOpen = state.expanded.has(id);
  const open = (wantOpen == null) ? !isOpen : wantOpen;
  if (open) state.expanded.add(id); else state.expanded.delete(id);
  render();
}
function sendShell(verb, node) {
  if (!node) return;
  post({ cmd: "shell", verb, path: nodeFullPath(node), isDir: !!node.isDir, name: node.name });
}
function selNodes() {
  return state.rows.filter(r => state.selectedIds.has(r.node.id)).map(r => r.node);
}

document.addEventListener("keydown", e => {
  // 输入框里打字不拦截
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  const i = focusRow();
  const node = i >= 0 ? state.rows[i].node : null;
  const ctrl = e.ctrlKey, shift = e.shiftKey;

  switch (e.key) {
    case "ArrowDown": e.preventDefault(); moveSel(1); return;
    case "ArrowUp":   e.preventDefault(); moveSel(-1); return;
    case "ArrowRight":
      e.preventDefault();
      if (i < 0) return;
      toggleExpand(i, true);          // 展开（或进入）
      return;
    case "ArrowLeft":
      e.preventDefault();
      if (i < 0) return;
      if (state.rows[i].hasKids && state.expanded.has(state.rows[i].node.id)) toggleExpand(i, false);
      else if (state.rows[i].depth > 0) {   // 已收起 → 跳到父行
        const d = state.rows[i].depth;
        for (let k = i - 1; k >= 0; k--) if (state.rows[k].depth < d) {
          selectRow(k, {}); ensureVisible(k); break;
        }
      }
      return;
    case "Enter":
      e.preventDefault();
      if (!node) return;
      if (node.isDir) enter(node); else post({ cmd:"open", path:nodeFullPath(node) });
      return;
    case "Backspace":
      e.preventDefault();
      if (state.current && state.current.parent) enter(state.current.parent);
      return;
    case "F2":
      e.preventDefault();
      if (node) sendShell("rename", node);
      return;
    case "Delete":
      e.preventDefault();
      sendShell(shift ? "delete_perm" : "delete", node);
      return;
    case "a": case "A":
      if (ctrl) {
        e.preventDefault();
        state.selectedIds.clear();
        state.rows.forEach(r => state.selectedIds.add(r.node.id));
        state.anchorIdx = 0;
        syncListSelection();
      }
      return;
    case "c": case "C":
      if (ctrl && node) { e.preventDefault(); sendShell("copy", node); }
      return;
    case "x": case "X":
      if (ctrl && node) { e.preventDefault(); sendShell("cut", node); }
      return;
    case "v": case "V":
      if (ctrl) { e.preventDefault(); sendShell("paste", null); }
      return;
    case "n": case "N":
      if (ctrl && shift) { e.preventDefault(); sendShell("newfolder", null); }
      return;
  }
});

// 右键：定位当前选中项 / 打开所在目录 / 复制路径
document.addEventListener("contextmenu", e => {
  const rowEl = e.target.closest("[data-row]");
  const inTreemap = rightEl.contains(e.target);
  if (!rowEl && !inTreemap) return;
  e.preventDefault();
  let node = null;
  if (rowEl) {
    const r = state.rows[+rowEl.dataset.row];
    node = r && r.node;
  } else {
    const p = tmLocalPoint(e);
    node = tmHitTest(p.x, p.y);
  }
  if (!node) return;

  // 树图里【滚轮框选】过某个目录时，右键应该作用于【框选的那个目录】，
  // 而不是之前选中的文件。框选优先。
  if (inTreemap && wheelFocusId != null) {
    const fn = findNodeById(wheelFocusId);
    if (fn) {
      post({ cmd:"menu", path: nodeFullPath(fn), paths: [nodeFullPath(fn)],
             isDir: fn.isDir, name: fn.name });
      return;
    }
  }

  // 右键【不改变选择】。菜单作用于「当前选择集」：
  //   · 已有选中项 → 保持不动，菜单作用于全部选中项
  //   · 没有选中项 → 只作用于右键的项
  // （用户明确：真实资源管理器没有"右键改选"这个行为。）
  let paths;
  if (state.selectedIds.size > 0) {
    paths = state.rows
      .filter(r => state.selectedIds.has(r.node.id))
      .map(r => nodeFullPath(r.node))
      .filter(Boolean);
  } else {
    paths = [nodeFullPath(node)];
  }
  if (!paths.length) paths = [nodeFullPath(node)];

  post({ cmd:"menu", path: nodeFullPath(node), paths, isDir: node.isDir, name: node.name });
});

// ===== 拖拽：列宽 + 左右分栏 =====
let suppressHeadClick = false;
function applySplit() {
  const main = document.querySelector(".main");
  const frac = Math.min(0.85, Math.max(SPLIT_MIN, splitFrac));
  document.documentElement.style.setProperty("--split", (frac * 100).toFixed(2) + "%");
  renderTreemap();          // 树图尺寸变了，重烘焙
}
function applyColWidths() {
  render();                 // 表头 + 行都按新的 colX/colW 重排
}

// 列宽手柄
document.getElementById("head").addEventListener("mousedown", e => {
  const grip = e.target.closest(".grip");
  if (!grip) return;
  e.preventDefault();
  const key = grip.dataset.col;
  const startX = e.clientX;
  const def = COL_DEFS.find(d => d.k === key);
  const startW = key === "nm" ? nameW : (def ? def.w : 0);
  document.body.classList.add("dragging");
  const move = ev => {
    const dx = ev.clientX - startX;
    let w = startW + dx;
    if (key === "nm") { nameW = Math.max(NAME_MIN, w); }
    else if (def) { def.w = Math.max(def.min, w); }
    layoutCols();
    // 只更新表头与行的位置（轻量：直接改已有 DOM 的 style，不重建）
    refreshGeometry();
  };
  const up = () => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    document.body.classList.remove("dragging");
    suppressHeadClick = true;        // 抑制紧随其后的 click（否则会触发排序）
    saveColPrefs();
    render();               // 结束后整体重排一次，保证一致
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
});

// 左右分栏条
document.getElementById("splitter").addEventListener("mousedown", e => {
  e.preventDefault();
  const sp = document.getElementById("splitter");
  sp.classList.add("dragging");
  document.body.classList.add("dragging");
  const main = document.querySelector(".main");
  const move = ev => {
    const r = main.getBoundingClientRect();
    splitFrac = Math.min(0.85, Math.max(SPLIT_MIN, (ev.clientX - r.left) / r.width));
    applySplit();
  };
  const up = () => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    sp.classList.remove("dragging");
    document.body.classList.remove("dragging");
    saveColPrefs();
    render();
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
});

// 拖动过程中只挪已渲染元素的坐标，不重建 DOM（否则几万块会卡）
function refreshGeometry() {
  layoutCols();
  const head = document.getElementById("head");
  const pos = [
    [NAME_X, colW.nm], [colX.size, colW.size], [colX.pct, colW.pct],
    [colX.type, colW.type], [colX.files, colW.files],
  ];
  head.querySelectorAll(".hcell").forEach((el, i) => {
    if (!pos[i]) return;
    el.style.left = pos[i][0] + "px";
    el.style.width = pos[i][1] + "px";
  });
  innerEl.querySelectorAll(".row").forEach(row => {
    const kids = row.children;
    // 顺序：twist, nm, size, pct, type, files
    if (kids[1]) { kids[1].style.left = (NAME_X + curDepthOf(row)) + "px"; kids[1].style.width = (colW.nm - curDepthOf(row)) + "px"; }
    if (kids[2]) { kids[2].style.left = colX.size + "px"; kids[2].style.width = colW.size + "px"; }
    if (kids[3]) { kids[3].style.left = colX.pct + "px";  kids[3].style.width = colW.pct + "px"; }
    if (kids[4]) { kids[4].style.left = colX.type + "px"; kids[4].style.width = colW.type + "px"; }
    if (kids[5]) { kids[5].style.left = colX.files + "px"; kids[5].style.width = colW.files + "px"; }
  });
}
function curDepthOf(row) {
  const i = +row.dataset.row;
  const r = state.rows[i];
  return r ? r.depth * INDENT : 0;
}

// ===== 滚轮逐级父级框选（移植旧版 treemap.cpp 的行为）=====
// 上滚一格：把「框选目标」提升到当前 hover/选中节点的父级，
//           父级通常没有对应单块 → 画它所有后代矩形的【并集框】。
// 下滚一格：逐级回退（出栈）。
const wheelStack = [];      // 每一层记录 {id, rect}
let wheelFocusId = null;    // 当前框选的目标节点 id（null = 无框选）
let wheelFocusRect = null;  // 该节点的并集框
let wheelBaseHoverId = null; // 本次框选会话起始时所悬浮的块 id（换块就重置会话）
let lastWheelTick = 0;      // 滚轮后 500ms 内的点击视为「只框选、不进入」

// 结束当前上滚框选会话（焦点框随之落到鼠标所在块）
function resetWheelFocus(currentId) {
  wheelStack.length = 0;
  wheelFocusId = null;
  wheelFocusRect = null;
  wheelBaseHoverId = (currentId == null ? null : currentId);
}

// 求某节点块的画布矩形（O(1)：矩形就挂在节点上）
// —— 目录的「并集框」就是它自己的块矩形：它的子块严格铺满它（squarify），
//    所以不需要再去扫所有后代叶子（旧实现是 O(n)+O(n·深度)）。
function unionRectOf(id) {
  const n = (id && id.id != null) ? id : findNodeById(id);
  if (!n) return null;
  // 根/当前目录本身在布局里没有块（collectLeaves 从它的 children 开始铺），
  // 但它的后代铺满整块画布 —— 旧实现（扫后代叶子）返回的就是整块画布，
  // 上滚框选到顶时会用到，这里保持同样的语义。
  if (n === state.current || n === state.root) {
    const { W, H } = ensureCanvas();
    return { x0: 0, y0: 0, x1: Math.ceil(W), y1: Math.ceil(H) };
  }
  if (!nodeBlockValid(n)) return null;
  const R = tmRectOfNode(n);
  if (R.x1 - R.x0 < 1 || R.y1 - R.y0 < 1) return null;
  return { x0: R.x0, y0: R.y0, x1: R.x1, y1: R.y1 };
}
function isDescendantOf(node, ancestorId) {
  for (let p = node.parent; p; p = p.parent) if (p.id === ancestorId) return true;
  return false;
}

// 从节点出发，找到它在当前布局里「最近的、有块的祖先」
function nearestAncestorWithBlock(node) {
  for (let p = node.parent; p; p = p.parent) {
    if (unionRectOf(p.id)) return p;
  }
  return null;
}

// 焦点框的悬浮信息面板（文件、文件夹通用）。
// 框和它是【一体】的：永远贴在框的外侧，跟着框走。
function drawInfoLabel(g, R, node, W, H) {
  if (!node || !R) return;
  const total = (state.current && state.current.size) || 1;
  const pct = (node.size / total * 100).toFixed(1);
  // 完整路径（没有 path 字段时用父链拼）
  let fullPath = nodeFullPath(node);
  const lines = [
    fullPath,                                 // 第一行：完整路径
    `${node.name || ""}`,                     // 第二行：名称
    `${fmtSize(node.size)} \u00b7 ${pct}%`,  // 第三行：大小 \u00b7 占比
    node.isDir ? ("目录" + (node.dirCount != null ? " · " + node.dirCount + " 项" : "")) : "文件",
  ];
  g.font = "13px \'Microsoft YaHei\', \'Microsoft YaHei UI\', sans-serif";
  const padX = 8, padY = 5, lh = 18;
  const maxTW = Math.min(W - 16, Math.max(160, W * 0.7));
  for (let i = 0; i < lines.length; i++) lines[i] = fitText(g, lines[i], maxTW - padX * 2);
  let tw = 0;
  for (const t of lines) tw = Math.max(tw, g.measureText(t).width);
  const bw = tw + padX * 2, bh = lines.length * lh + padY * 2;

  // 贴框外侧：右上 → 左上 → 右下 → 左下 → 框内左上（都要留在画布内）
  let bx = R.x1 + 6, by = R.y0 - bh - 6;
  if (bx + bw > W - 2) bx = R.x0 - bw - 6;
  if (bx < 2) bx = Math.min(R.x0 + 2, Math.max(2, W - bw - 2));
  if (by < 2) by = Math.min(R.y1 + 6, Math.max(2, H - bh - 2));
  if (by + bh > H - 2) by = Math.max(2, H - bh - 2);

  g.save();
  g.fillStyle = "rgba(20,23,28,.88)";
  g.fillRect(bx, by, bw, bh);
  g.strokeStyle = "rgba(255,255,255,.35)";
  g.lineWidth = 1 / tmDpr;
  g.strokeRect(bx, by, bw, bh);
  g.textBaseline = "top";
  lines.forEach((t, i) => {
    g.fillStyle = i === 0 ? "rgba(255,255,255,.62)"     // 路径
                : i === 1 ? "#fff"                      // 名称
                : i === 2 ? "rgba(255,255,255,.78)"     // 大小·占比
                          : "rgba(255,255,255,.55)";    // 文件/目录
    g.fillText(t, bx + padX, by + padY + i * lh);
  });
  g.restore();
}

function paintWheelFocus() {
  // 有滚轮框选时不再画鼠标悬停框 —— 同一时刻只有一个框（框选优先）
  paintTreemap(wheelFocusRect != null);
  if (!wheelFocusRect) return;
  const R = wheelFocusRect;
  tmCtx.save();
  // 框外压暗：整幅盖一层半透明黑，再把框内擦亮（简单做法：只画框线和四边暗调）
  tmCtx.fillStyle = "rgba(0,0,0,.35)";
  const W = tmBakedW, H = tmBakedH;
  tmCtx.fillRect(0, 0, W, R.y0);
  tmCtx.fillRect(0, R.y1, W, H - R.y1);
  tmCtx.fillRect(0, R.y0, R.x0, R.y1 - R.y0);
  tmCtx.fillRect(R.x1, R.y0, W - R.x1, R.y1 - R.y0);
  // 框线：用 fillRect 画 4 条边，宽度按 dpr 换算 → 物理正好 1px（不再粗）
  const lw = 1 / tmDpr;
  tmCtx.fillStyle = "#ffffff";
  tmCtx.fillRect(R.x0, R.y0, R.x1 - R.x0, lw);            // 上
  tmCtx.fillRect(R.x0, R.y1 - lw, R.x1 - R.x0, lw);       // 下
  tmCtx.fillRect(R.x0, R.y0, lw, R.y1 - R.y0);            // 左
  tmCtx.fillRect(R.x1 - lw, R.y0, lw, R.y1 - R.y0);       // 右

  const focusNode = (wheelFocusId != null) ? findNodeById(wheelFocusId) : null;
  drawInfoLabel(tmCtx, R, focusNode, W, H);
  tmCtx.restore();
}

rightEl.addEventListener("wheel", e => {
  // 直接在树图上滚（旧版 WM_MOUSEWHEEL 就没有 Ctrl 判断）。
  // 语义（按用户要求）：框选状态【绑定到鼠标当前所在的块】。
  //   - 鼠标换到别的块上 → 视为一次全新的框选，从该块的父级开始上滚
  //   - 鼠标不动继续上滚 → 逐级往上（父级 → 祖父级 …）
  //   - 下滚 → 沿本次会话的层级历史逐级回退；退完就清空
  e.preventDefault();
  lastWheelTick = Date.now();
  const dir = e.deltaY < 0 ? "up" : "down";     // 上滚 = deltaY < 0

  const hoverNode = tmHoverId != null ? findNodeById(tmHoverId) : null;

  if (dir === "up") {
    // 鼠标换块了（或之前没框选）→ 重置历史，从当前块的父级开始
    if (hoverNode && wheelBaseHoverId !== tmHoverId) {
      wheelStack.length = 0;
      wheelFocusId = null;
      wheelFocusRect = null;
      wheelBaseHoverId = tmHoverId;
    }
    if (!hoverNode && wheelBaseHoverId !== null) {
      // 鼠标移到空白处：也重置，允许从「上次基块」重新开始
      wheelStack.length = 0;
      wheelFocusId = null;
      wheelFocusRect = null;
      wheelBaseHoverId = null;
    }

    // 起点：已有框选就从框选目标往上；否则从鼠标所在块开始
    let startNode = (wheelFocusId != null) ? findNodeById(wheelFocusId) : null;
    if (!startNode) startNode = hoverNode || (state.selectedId != null ? findNodeById(state.selectedId) : null);
    if (!startNode) return;

    // 第一次上滚：框选 startNode 的父级；之后每次再往上
    const par = (wheelFocusId == null && startNode === hoverNode)
                  ? startNode.parent          // 首次：当前块的父级
                  : startNode.parent;         // 之后：继续往上
    if (!par) return;                          // 已在根目录
    const rect = unionRectOf(par.id);
    if (!rect) return;
    wheelStack.push({ id: wheelFocusId, rect: wheelFocusRect });
    wheelFocusId = par.id;
    wheelFocusRect = rect;

  } else {
    // 下滚：本次会话内逐级回退（只退到起点为止，不会跳回别的块的旧状态）
    if (wheelStack.length) {
      const back = wheelStack.pop();
      wheelFocusId = back.id;
      wheelFocusRect = back.rect;
      // 退回到最初（没有框选）时，一并清掉基块标记
      if (wheelFocusId == null) wheelBaseHoverId = tmHoverId;
    } else {
      wheelFocusId = null;
      wheelFocusRect = null;
      wheelBaseHoverId = tmHoverId;
    }
  }
  // 焦点框一出现/变化，立刻收起鼠标 tooltip —— 同一时刻只留一个信息面板
  if (wheelFocusRect) tmHideTip();
  paintWheelFocus();
}, { passive: false });

// 滚轮后 500ms 内的树图点击：只框选、不进入（避免误触）
function withinWheelWindow() { return Date.now() - lastWheelTick < 500; }

// ===== 与 C++ 通信 =====
function post(obj) {

    if (window.chrome && chrome.webview) {
      chrome.webview.postMessage(obj);

    document.getElementById("st1").textContent = "!! chrome.webview 不可用";
    return false;
  } catch (e) {

    return false;
  }
}

// 导航历史（栈）：进入子目录压栈，返回弹栈
const navHist = [];

function enter(node, opts) {
  opts = opts || {};
  if (!node || !node.isDir) return;
  if (!opts.noHistory && state.current && state.current !== node) {
    navHist.push(state.current);
    if (navHist.length > 200) navHist.shift();
  }
  state.current = node;
  state.view = node.children || [];
  state.expanded.clear();
  // 根目录：默认展开（首次进入时），但允许用户点箭头折叠
  if (state.rootNode) state.expanded.add(state.rootNode.id);
  state.selectedId = null;
  wheelStack.length = 0; wheelFocusId = null; wheelFocusRect = null;
  renderCrumbs();

  // 懒加载：子项缺失（被 JSON 截断 或 未扫到）时向宿主请求
  if (!opts.skipFetch && (!node.children || node.children.length === 0) &&
      node.hasKids !== false) {
    post({ cmd: "list", path: nodeFullPath(node), id: node.id });
    document.getElementById("st0").textContent = "正在加载 " + node.name + " …";
  }
  render();
  playZoomAnim();
}

// 播放「放大到位」动画（先快后慢，easeOutExpo ≈ 1-e^(-x)）。
// 支持 FLIP：传入旧矩形（进入前那块在画布里的位置），新画面会从那个位置
// 缩放/平移到铺满，视觉上就是「点中的块放大到全屏」（像 WizTree）。
// 重启动画：先设初始 transform → 强制 reflow → 再清掉，让 CSS 过渡播起来。
let pendingFlip = null;    // 已废弃：视口模式下不需要 FLIP（见 playZoomAnim 注释）

function playZoomAnim() {
  const els = [innerEl, rightEl].filter(Boolean);
  pendingFlip = null;

  // 视口模式下【不要】对 canvas 做 FLIP transform：
  // bakeView 已经把「当前目录铺满画布」画好了，再叠加 translate+scale 会让
  // 内容错位/留白 → 用户看到「带豁口的长方形」（踩过）。
  // 只做一次轻微的淡入即可，放大感来自视口本身的变化。
  if (tmCanvas) {
    tmCanvas.style.transition = "none";
    tmCanvas.style.opacity = "0.55";
    void tmCanvas.offsetWidth;
    tmCanvas.style.transition = "opacity .18s cubic-bezier(0.16,1,0.3,1)";
    tmCanvas.style.opacity = "1";
    setTimeout(() => { if (tmCanvas) tmCanvas.style.transition = ""; }, 200);
  }

  // 列表/右栏：沿用 class 动画
  for (const el of els) {
    el.classList.remove("anim");
    void el.offsetWidth;
    el.classList.add("anim");
    el.addEventListener("animationend", () => el.classList.remove("anim"), { once: true });
  }
}

function goBack() {
  const prev = navHist.pop();
  if (prev) enter(prev, { noHistory: true });
}
function goUp() {
  if (state.current && state.current.parent) enter(state.current.parent);
}

// 面包屑
function renderCrumbs() {
  const el = document.getElementById("crumbs");
  if (!state.current) { el.innerHTML = ""; return; }
  const chain = [];
  for (let n = state.current; n; n = n.parent) chain.unshift(n);
  el.innerHTML = chain.map((n, i) =>
    `<b data-crumb="${i}">${esc(n.name)}</b>` +
    (i < chain.length - 1 ? "<span>›</span>" : "")).join("");
  state._crumbChain = chain;
}
document.getElementById("crumbs").addEventListener("click", e => {
  const b = e.target.closest("[data-crumb]");
  if (!b) return;
  const n = state._crumbChain && state._crumbChain[+b.dataset.crumb];
  if (n) enter(n);
});

// 懒加载回来的子项：挂到对应节点上并补 parent 链，然后重新渲染
// ===== 渐进细化：后台小批量拉取子项，边拉边补画（用户看到图「慢慢长细」）=====
// 扫描完先渲染粗图（顶层少量），然后 BFS 遍历视野里的目录，每次只请求一个
// 目录的子项（cmd:"list"），拿到就把子树补进布局并重画。
let _detailQueue = [];
let _detailRunning = false;
let _detailTimer = 0;

function startProgressiveDetail() {
  clearTimeout(_detailTimer);
  _detailQueue = [];
  _detailRunning = false;
  if (!state.root) return;
  _detailQueue.push(state.root);
  _detailRunning = true;
  stepDetail();
}

function stepDetail() {
  if (!_detailQueue.length) {
    _detailRunning = false;
    post({ cmd:"diag", what:"detailDone" });
    return;
  }
  const node = _detailQueue.shift();
  // 需要细化：目录，且磁盘上的子项数 > 已加载的子项数（说明被截断过）
  const need = node.isDir &&
               (node.dirCount || 0) > (node.children ? node.children.length : 0);
  if (need) post({ cmd: "list", path: nodeFullPath(node), id: node.id });
  if (node.children) {
    for (const c of node.children) {
      if (c.isDir) _detailQueue.push(c);
      if (_detailQueue.length > 4000) break;
    }
  }
  _detailTimer = setTimeout(stepDetail, 40);   // 让出主线程，界面始终可交互
}

function applyChildren(id, children) {
  const node = findNodeById(id);
  if (!node) return;
  (function link(list, par) {
    for (const c of list) { c.parent = par; if (c.children) link(c.children, c); }
  })(children, node);
  node.children = children;
  node.hasKids = children.length > 0;
  _bumpKidsStamp();          // 指纹变化 → 下次 renderTreemap 会重布局
  if (state.current && state.current.id === id) {
    state.view = children;
    document.getElementById("st0").textContent =
      `${node.name} · ${children.length} 项`;
    render();
  } else {
    // 后台补上了某个目录的子项：重算布局让树图变细（渐进细化的一部分）
    renderTreemap();
  }
}

// 在整棵树（含已加载层）里找节点
// ⚡ 常规调用走 _treeById（O(1)）：这个函数在悬停/选中路径上被反复调用，
//    旧实现每次都从根递归遍历整棵树（84.6 万节点时每次都是全树扫描）。
function findNodeById(id, root) {
  if (root === undefined && state._treeById && state._treeById.has(id))
    return state._treeById.get(id);
  root = root || state.root;
  if (!root) return null;
  if (root.id === id) return root;
  if (root.children) {
    for (const c of root.children) {
      const hit = findNodeById(id, c);
      if (hit) return hit;
    }
  }
  return null;
}

// 几何量测（DISKMATE_GEOM=1 时）：把每行的箭头/名字实际像素位置写进日志

    rows.push({
      name: nm.textContent.slice(0, 14),
      isFile: tw.classList.contains("empty"),
      indent: cs.paddingLeft,
      twistL: Math.round(tb.left - lb.left),
      twistW: Math.round(tb.width),
      nameL: Math.round(nb.left - lb.left),
      namePadL: cs.paddingLeft,
      twistDisplay: getComputedStyle(tw).display,
      twistMaxW: getComputedStyle(tw).maxWidth,
      twistFlex: getComputedStyle(tw).flex,
      arrowVarResolved: getComputedStyle(document.documentElement).getPropertyValue("--arrow").trim(),
      htmlHead: document.head.innerHTML.length,
      hasNewCSS: document.head.innerHTML.includes("min-width:var(--arrow)"),
      twistHTML: tw.outerHTML,
      twistChildNodes: tw.childNodes.length,
      twistText: JSON.stringify(tw.textContent),
      nmHTML: nm.outerHTML.slice(0, 80),
      rowDisplay: getComputedStyle(el).display,
      rowFlexDir: getComputedStyle(el).flexDirection,
      twCS_width: getComputedStyle(tw).width,
      twCS_flexBasis: getComputedStyle(tw).flexBasis,
      twCS_flexGrow: getComputedStyle(tw).flexGrow,
      twCS_flexShrink: getComputedStyle(tw).flexShrink,
      twCS_display: getComputedStyle(tw).display,
      twCS_visibility: getComputedStyle(tw).visibility,
      twCS_overflow: getComputedStyle(tw).overflow,
      allRules: (function(){
        const out=[];
        for (const sh of document.styleSheets) {
          try { for (const r of sh.cssRules) {
            if (r.selectorText && r.selectorText.includes("twist"))
              out.push(r.selectorText + "{" + r.style.cssText.slice(0,90) + "}");
          } } catch(e){}
        }
        return out;
      })(),
      twTag: tw.tagName,
      twParent: tw.parentNode ? tw.parentNode.className : "none",
      twSiblings: tw.parentNode ? tw.parentNode.children.length : -1,
      twOffsetW: tw.offsetWidth,
      twClientW: tw.clientWidth,
      twistL2: Math.round(tw.getBoundingClientRect().left - lb.left),
      twistR2: Math.round(tw.getBoundingClientRect().right - lb.left),
      forceTest: (function(){
        const c = tw.cloneNode(true);
        c.style.cssText = "display:block;width:22px;min-width:22px;max-width:22px;flex:0 0 22px";
        el.appendChild(c);
        const w1 = Math.round(c.getBoundingClientRect().width);
        c.style.cssText = "";
        const w2 = Math.round(c.getBoundingClientRect().width);
        const cw = Math.round(tw.getBoundingClientRect().width);
        c.remove();
        return { inlineForced: w1, cleared: w2, original: cw };
      })(),
    });
  });
  post({ cmd: "diag", what: "geom", count: rows.length, rows });
};

// 漂移诊断：连续开关同一目录 6 次，每次记录列坐标
window.__drift = function () {
  const log = [];
  const dir = state.rows.find(r => r.hasKids && !r.up);
  if (!dir) { post({cmd:"diag", what:"drift", err:"no dir"}); return; }
  const id = dir.node.id;
  for (let k = 0; k < 6; k++) {
    state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id);
    render();
    log.push({
      k, clientW: listEl.clientWidth, scrollbar: listEl.offsetWidth - listEl.clientWidth,
      listW: Math.round(listEl.getBoundingClientRect().width),
      leftW: Math.round(document.querySelector(".left").getBoundingClientRect().width),
      mainW: Math.round(document.querySelector(".main").getBoundingClientRect().width),
      bodyW: document.body.clientWidth,
      winW: window.innerWidth,
      NAME_X, nmW: colW.nm, sizeX: colX.size, typeX: colX.type, filesX: colX.files,
      innerW: Math.round(innerEl.getBoundingClientRect().width),
    });
  }
  post({ cmd: "diag", what: "drift", log });
};

// 自检（仅当宿主注入 __SELFTEST 时跑）：验证展开/主题/排序/返回上级
window.__runSelfTest = function () {
  const rep = {};
  try {
    const before = state.rows.length;
    const tw = document.querySelector(".twist:not(.empty)");
    if (tw) {
      tw.click();
      rep.expand = { before, after: state.rows.length, grew: state.rows.length > before };
    } else rep.expand = "no twist found";

    // 主题
    const el = document.documentElement;
    const t0 = el.getAttribute("data-theme") || "dark";
    document.getElementById("theme").click();
    const t1 = el.getAttribute("data-theme") || "dark";
    rep.theme = { from: t0, to: t1, changed: t0 !== t1 };
    document.getElementById("theme").click();   // 切回

    // 排序
    const first0 = state.rows[state.current && state.current.parent ? 1 : 0]?.node.name;
    document.querySelector('[data-i="0"]').click();
    const first1 = state.rows[state.current && state.current.parent ? 1 : 0]?.node.name;
    rep.sort = { from: first0, to: first1, changed: first0 !== first1 };

    // 对齐检查：对每个「深度」分别报告 目录行 / 文件行 的名字左边缘
    {
      const lb = listEl.getBoundingClientRect();
      const buckets = {};
      innerEl.querySelectorAll(".row").forEach(el => {
        const lab = el.querySelector(".nm");
        const tw = el.querySelector(".twist");
        const ind = el.querySelector(".indent");
        if (!lab || !tw) return;
        const depth = parseInt(ind.style.width || "0", 10) / 16 | 0;
        const isFile = tw.classList.contains("empty");
        const key = depth + (isFile ? "F" : "D");
        const cs = getComputedStyle(tw);
        const rec = {
          name: lab.textContent.slice(0, 8),
          cls: tw.className,
          html: tw.outerHTML.slice(0, 50),
          twistW: Math.round(tw.getBoundingClientRect().width),
          cssFlex: cs.flex, cssW: cs.width, cssMaxW: cs.maxWidth,
          arrowVar: cs.getPropertyValue("--arrow").trim(),
          labelL: Math.round(lab.getBoundingClientRect().left - lb.left),
        };
        (buckets[key] = buckets[key] || []).push(rec);
      });
      const summary = {};
      for (const k in buckets) {
        const ls = [...new Set(buckets[k].map(o => o.labelL))];
        summary[k] = { n: buckets[k].length, labelLefts: ls, sample: buckets[k][0] };
      }
      rep.align = summary;
    }
    // 命中精度：取若干块，检查它的四角像素点是否都命中自己
    {
      let okAll = true, checked = 0, bad = [];
      for (const r of tmLiveLeaves.slice(0, 40)) {
        const R = tmRect(r);
        if (R.w < 2 || R.h < 2) continue;
        checked++;
        const pts = [[R.x0, R.y0], [R.x0, R.y1 - 1], [R.x1 - 1, R.y0], [R.x1 - 1, R.y1 - 1],
                     [Math.floor((R.x0 + R.x1) / 2), Math.floor((R.y0 + R.y1) / 2)]];
        for (const [px, py] of pts) {
          const h = tmHitTest(px, py);
          // 中心点必须命中自己；四角可能被后画的覆盖，只要命中即可（不算错）
          if (!h) { okAll = false; bad.push([px, py, "miss"]); }
        }
      }
      rep.hitPrec = { checked, okAll, bad: bad.slice(0, 3) };
    }
    // 导航测试：进一个子目录 → 面包屑 → 上级 → 返回
    {
      const rootName = state.current ? state.current.name : null;
      const rootPath = state.current ? nodeFullPath(state.current) : null;
      const dir = state.view.find(v => v.isDir);
      if (dir) {
        enter(dir);
        const crumbs1 = document.getElementById("crumbs").textContent;
        const cur1 = state.current.name;
        const rows1 = state.rows.length;
        goUp();
        const backToRoot = nodeFullPath(state.current) === rootPath;
        goBack();
        rep.nav = {
          entered: dir.name, curAfterEnter: cur1, crumbs: crumbs1,
          rowsInChild: rows1,
          upWorks: backToRoot,
          backWorks: nodeFullPath(state.current) === rootPath,
          hasBackBtn: !!document.getElementById("back"),
          hasUpBtn: !!document.getElementById("up"),
          rootName,
        };
      } else rep.nav = { noDir: true, rootName };
    }
    // 树图块数（canvas：从布局数组取）
    rep.treemap = tmLiveLeaves.length;
    rep.arrows = document.querySelectorAll(".twist:not(.empty)").length;
    rep.upRow = !!document.querySelector(".row") &&
                document.querySelector(".row .nm")?.textContent === "..";

    // 树图选中：模拟点第一个块的中心点，看 selectedId 与联动
    if (tmLiveLeaves.length) {
      const r0 = tmLiveLeaves[0];
      // 注意：tmHitTest 收的是【画布像素】，r0.x/y 是虚拟坐标 → 必须先过视口
      const c0x = vx(r0.x + r0.w / 2), c0y = vy(r0.y + r0.h / 2);
      const hit = tmHitTest(c0x, c0y);
      rep.tmSelect = {
        leaves: tmLiveLeaves.length,
        hitId: hit ? hit.id : null,
        expectId: r0.node.id,
        hitOk: !!hit && hit.id === r0.node.id,
      };
      // 选中性能：轻路径应远快于全量重画
      const t0 = performance.now();
      setTreemapSelection(r0.node.id);
      rep.tmSelect.selMs = +(performance.now() - t0).toFixed(2);
      const t1 = performance.now();
      renderTreemap();
      rep.tmSelect.fullMs = +(performance.now() - t1).toFixed(2);

      // ⚡ 命中测试对照：新实现（沿树下行的递归）必须与旧的线性扫描逐点完全一致。
      // 采样：每 37 个字的网格点 + 每块中心点，比较两者返回的 node.id。
      const { W: cW, H: cH } = ensureCanvas();
      let sample = 0, mismatch = 0, badSample = null;
      const cmp = (x, y) => {
        sample++;
        const a = tmHitTest(x, y), b = tmHitTestScan(x, y);
        const ai = a ? a.id : null, bi = b ? b.id : null;
        if (ai !== bi) { mismatch++; if (!badSample) badSample = { x: Math.round(x), y: Math.round(y), fast: ai, scan: bi }; }
      };
      for (let y = 0; y < cH; y += 37) for (let x = 0; x < cW; x += 37) cmp(x + 0.5, y + 0.5);
      for (let i = 0; i < tmLiveLeaves.length; i += Math.max(1, (tmLiveLeaves.length / 400) | 0)) {
        const r = tmLiveLeaves[i];
        cmp(vx(r.x + r.w / 2), vy(r.y + r.h / 2));
      }
      const _t2 = performance.now();
      for (let i = 0; i < 200; i++) tmHitTest((i * 7.3) % cW, (i * 11.7) % cH);
      const fastMs = +(performance.now() - _t2).toFixed(3);
      const _t3 = performance.now();
      for (let i = 0; i < 200; i++) tmHitTestScan((i * 7.3) % cW, (i * 11.7) % cH);
      const scanMs = +(performance.now() - _t3).toFixed(3);
      rep.hitTest = { sample, mismatch, badSample, fast200Ms: fastMs, scan200Ms: scanMs };
    }
  } catch (e) {
    rep.error = e.message;
  }
  post({ cmd: "diag", what: "selftest", report: rep });
};

// 诊断：捕获页面上的任意点击/按键，发给宿主写日志
document.addEventListener("click", e => {
  post({ cmd: "diag", what: "click", x: e.clientX, y: e.clientY,
         tag: (e.target && e.target.id) || (e.target && e.target.className) || "?" });
}, true);
document.addEventListener("mousedown", e => {
  post({ cmd: "diag", what: "down", x: e.clientX, y: e.clientY });
}, true);

// 宿主 → 页面：WebView2 用 PostWebMessageAsJson 推的对象走 message 事件
if (window.chrome && chrome.webview) {
  chrome.webview.addEventListener("message", ev => {
    const d = ev.data;
    if (!d) return;
    if (d.stats !== undefined && d.root !== undefined) {
      window.__host.setTree(d);          // 扫描结果
    } else if (d.kind === "progress") {
      window.__host.setProgress(d.items, d.bytes);
    } else if (d.kind === "theme") {
      applyTheme(d.theme);               // 宿主推来的已存主题
    } else if (d.kind === "settings") {
      setData = d.data || {};
      buildSettingsForm();
    } else if (d.kind === "scanfail") {
      // 宿主拒绝了这次扫描（无效路径 / 已在扫描中）→ 页面复位，别卡在"扫描中"
      if (typeof setScanState === "function") setScanState(false);
      const w = document.getElementById("progWrap");
      if (w) w.style.display = "none";
      document.getElementById("st0").textContent =
        (d.reason || "扫描未开始");
      post({ cmd:"diag", what:"scanfail-ack", reason: d.reason || "" });
    } else if (d.kind === "prefs") {
      // 宿主推来的界面偏好 blob → 页面自己解析并恢复（C++ 不懂内容）
      try {
        const p = JSON.parse(d.json || "{}");
        prefs = Object.assign({ theme: "dark", mapKind: "sqrt", ordKind: "sumG", powAlpha: 0.5 }, p);
      } catch (_) {}
      applyPrefs();
    } else if (d.kind === "libwords") {
      // 预字库：软件打开瞬间 C++ 推送；二进制 nameIdx < libCount 时按此索引取词
      window.__host._libWords = (d.words || []).slice();
    } else if (d.kind === "scanDone") {
      // 扫描完成轻量通知：立即收进度条/还原按钮（大 JSON 还在路上）
      const pw = document.getElementById("progWrap");
      if (pw) pw.style.display = "none";
      if (typeof setScanState === "function") setScanState(false);
    } else if (d.kind === "binPart") {
      // 二进制全量传输：分批 base64 片段，全部到齐后一次解析建树
      window.__host.addBinPart(d);
    } else if (d.kind === "binDone") {
      window.__host.finishBin(d);
    } else if (d.kind === "treePart") {
      // 全量传输：分批到达的扁平节点 → 按 parentId 挂到累积树
      window.__host.accumulatePart(d.nodes);
    } else if (d.kind === "treeDone") {
      // 全量树收齐：一次性建树 + 渲染
      window.__host.finalizeTree(d);
    } else if (d.kind === "children") {
      applyChildren(d.id, d.children);   // 懒加载的子项（全量模式下一般不会触发）
    }
  });
}

// C++ 调用入口（保留 ExecuteScript 路径，供少量简单调用）
window.__host = {
  // ===== 二进制全量传输：base64 分批 → 一次解析建树（不用 JSON） =====
  _binChunks: [],
  _libWords: [],      // 预字库：启动时 C++ 推送的高频词表（nameIdx < libCount 时引用）
  _binGot: 0,
  _binT0: 0,
  addBinPart(d) {
    if (!window.__host._binT0) window.__host._binT0 = performance.now();
    window.__host._binChunks.push({ seq: d.seq, s: atob(d.b64) });
    window.__host._binGot += d.size;
  },
  finishBin(d) {
    const t0 = performance.now();
    const chunks = window.__host._binChunks;
    chunks.sort((a, b) => a.seq - b.seq);
    let total = 0;
    for (const c of chunks) total += c.s.length;
    const bytes = new Uint8Array(total);
    let off = 0;
    for (const c of chunks) {
      const ss = c.s;
      for (let i = 0; i < ss.length; i++) bytes[off++] = ss.charCodeAt(i) & 0xFF;
    }
    window.__host._binChunks = [];
    window.__host._binGot = 0;
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    if (bytes.length < 24 || dv.getUint32(0, true) !== 0x4B4D4442) {
      document.getElementById("st0").textContent = "扫描失败（二进制流损坏）";
      if (typeof setScanState === "function") setScanState(false);
      return;
    }
    const nodeCount = dv.getUint32(8, true);
    const libCount = dv.getUint32(12, true);
    const strCount = dv.getUint32(16, true);   // wordCount：词表词数（不含预字库）
    // ---- 字符串表：前缀增量流 → 还原完整字节表 → 一次解码 → 按偏移切片 ----
    let q = 28;
    // UTF-16LE：偏移按【码元】记录（slice 码元索引才对齐；UTF-8 字节偏移切中文会错位）
    const strOff = new Uint32Array(strCount + 1);
    let totalCu = 0;
    for (let i = 0; i < strCount; i++) {
      const cl = dv.getUint16(q, true), sl = dv.getUint16(q + 2, true);
      strOff[i] = totalCu;
      totalCu += cl + sl;
      q += 4 + sl * 2;
    }
    strOff[strCount] = totalCu;
    const full = new Uint8Array(totalCu * 2);
    q = 28;   // header 28B：第二遍解码起点必须与第一遍一致
    let prevStartB = 0;
    for (let i = 0; i < strCount; i++) {
      const cl = dv.getUint16(q, true), sl = dv.getUint16(q + 2, true);
      const dst = strOff[i] * 2;
      if (cl > 0) {
        for (let k = 0; k < cl * 2; k++) full[dst + k] = full[prevStartB + k];
      }
      const src = q + 4;
      for (let k = 0; k < sl * 2; k++) full[dst + cl * 2 + k] = bytes[src + k];
      q += 4 + sl * 2;
      prevStartB = dst;
    }
    const allStr = new TextDecoder('utf-16le').decode(full);
    // ---- 节点区：28B/节点，父先子后 ----
    const nodes = new Array(nodeCount);
    let root = null;
    const getU64 = (pp) => Number(dv.getBigUint64(pp, true));
    for (let i = 0; i < nodeCount; i++) {
      const pid = dv.getUint32(q, true); q += 4;
      const size = getU64(q); q += 8;
      const fc = dv.getUint32(q, true); q += 4;
      const dc = dv.getUint32(q, true); q += 4;
      const flags = dv.getUint32(q, true); q += 4;
      const nameId = dv.getUint32(q, true); q += 4;
      // nameIdx < libCount → 预字库词；否则 → 词表词（索引 - libCount）
      const name = nameId < libCount
        ? window.__host._libWords[nameId] || ""
        : allStr.slice(strOff[nameId - libCount], strOff[nameId - libCount + 1]);
      const node = { id: i + 1, name,
                     size, fileCount: fc, dirCount: dc,
                     isDir: (flags & 1) !== 0, children: [] };
      if (pid === 0xFFFFFFFF) root = node;
      else {
        const par = nodes[pid];
        if (par) { node.parent = par; par.children.push(node); }
      }
      nodes[i] = node;
    }
    const recvMs = Math.round(performance.now() - (window.__host._binT0 || t0));
    // 收进度条 / 还原按钮
    const w = document.getElementById("progWrap");
    if (w) w.style.display = "none";
    if (typeof setScanState === "function") setScanState(false);
    if (!root) {
      document.getElementById("st0").textContent = "扫描失败（root 为空）";
      return;
    }
    state.root = root;
    state.rootNode = root;
    _lastTreeAt = Date.now();
    _scanT0 = 0;
    enter(root);
    const mftBtn = document.getElementById("mftToggle");
    if (mftBtn && d && typeof d.mode === "number") window.__mftMode(d.mode, true);
    state.expanded.add(root.id);
    tmLayoutKey = "";
    renderTreemap(true);
    startProgressiveDetail();
    const st = (d && d.stats) || {};
    _st0AfterRender =
      `扫描完成 · ${(d && d.mode) ? "MFT 直读" : "普通遍历"} · ${nodeFullPath(root) || ""} · ${fmtCount(st.items || 0)} 项`;
    document.getElementById("st0").textContent = _st0AfterRender;
    post({ cmd: "diag", what: "perf", binRecvMs: recvMs, nodes: nodeCount,
           strCount, strBytes: totalCu * 2, binBytes: bytes.length });
  },
  // ===== 全量传输：分批累积树（不懒加载，旧 JSON 路径保留作兼容） =====
  _treeById: new Map(),
  _recvT0: 0,
  accumulatePart(nodes) {
    if (!window.__host._recvT0) window.__host._recvT0 = performance.now();
    const byId = window.__host._treeById;
    for (const nd of nodes) {
      // path 只在根节点有（C++ 省传输）；子节点用 nodeFullPath(parent 链) 实时拼
      const node = { id: nd.id, name: nd.name, size: nd.size,
                     fileCount: nd.fileCount || 0, dirCount: nd.dirCount,
                     isDir: !!nd.isDir, children: [] };
      if (nd.parentId === 0) {
        state.root = node; state.rootNode = node;
        byId.set(node.id, node);
      } else {
        const par = byId.get(nd.parentId);
        if (par) {
          node.parent = par; par.children.push(node);
        }
        byId.set(node.id, node);
      }
    }
  },
  finalizeTree(d) {
    const _ft0 = performance.now();
    const root = state.root;
    if (!root) {
      document.getElementById("st0").textContent = "扫描失败（root 为空）";
      if (typeof setScanState === "function") setScanState(false);
      return;
    }
    // 收进度条 / 还原按钮
    const w = document.getElementById("progWrap");
    if (w) w.style.display = "none";
    if (typeof setScanState === "function") setScanState(false);
    _lastTreeAt = Date.now();
    _scanT0 = 0;
    enter(root);
    const _ft1 = performance.now();   // enter（左侧列表构建）完成
    const mftBtn = document.getElementById("mftToggle");
    if (mftBtn && d && typeof d.mode === "number")
      window.__mftMode(d.mode, true);   // 按钮显示 = 实际扫描模式
    state.expanded.add(root.id);
    tmLayoutKey = "";                    // 强制重布局（新扫描 id 从 1 重排）
    renderTreemap(true);
    startProgressiveDetail();
    const st = (d && d.stats) || {};
    _st0AfterRender =
      `扫描完成 · ${(d && d.mode) ? "MFT 直读" : "普通遍历"} · ${nodeFullPath(root) || ""} · ${fmtCount(st.items || 0)} 项`;
    document.getElementById("st0").textContent = _st0AfterRender;
    // 全量树已就绪：清空累积暂存，避免残留
    window.__host._treeById = new Map();
    // 计时诊断：接收/累积 + enter（列表构建）耗时
    const _ft2 = performance.now();
    post({ cmd:"diag", what:"perf",
      recvMs: Math.round(window.__host._recvT0 ? (_ft0 - window.__host._recvT0) : 0),
      enterMs: Math.round(_ft1 - _ft0),
      finalizeMs: Math.round(_ft2 - _ft0),
      nodes: 0 });
  },
  // 扫描完成：把整棵树交给前端
  setTree(payload) {
    // 扫描完成 → 立即收起进度条/还原按钮（不等树渲染，避免"卡住不结束"的感觉）
    const w0 = document.getElementById("progWrap");
    if (w0) w0.style.display = "none";
    if (typeof setScanState === "function") setScanState(false);
    // C++ 传来 {"stats":{...},"root":{...}}
    const root = payload && payload.root ? payload.root : payload;
    if (!root) {
      document.getElementById("st0").textContent = "扫描失败（root 为空）";
      return;
    }
    // 建立 parent 链（C++ 只给嵌套 children，前端补 parent 引用）
    (function link(n, par) {
      n.parent = par;
      if (n.children) for (const c of n.children) link(c, n);
    })(root, null);

    state.root = root;
    state.rootNode = root;          // 扫描的根目录 = 最顶层父集（始终作为第一行显示）
    _lastTreeAt = Date.now();       // 记下完成时刻（忽略之后迟到的 progress）
    _scanT0 = 0;
    {
      const w = document.getElementById("progWrap");
      if (w) w.style.display = "none";     // 扫描完成 → 收起进度条
      if (typeof setScanState === "function") setScanState(false);   // 按钮还原为「扫描」
    }
    enter(root);
    // 按钮显示 = 实际扫描模式（宿主 JSON 带 mode：0=普通遍历，1/2=MFT 直读）
    const mftBtn = document.getElementById("mftToggle");
    if (mftBtn && payload && typeof payload.mode === "number")
      window.__mftMode(payload.mode, true);   // 扫描完成：强制按【实际执行模式】显示（不依赖 admin）
    state.expanded.add(root.id);    // 根默认展开
    // 【关键】新扫描必须强制重布局：宿主每次扫描都把节点 id 从 1 开始编号，
    // 所以新树的 root.id 和旧树一样 → 布局缓存的 key 不变 → 不重布局，
    // 结果就是「左边列表换了、右边树图还是上一棵树」（踩过）。
    tmLayoutKey = "";
    renderTreemap(true);
    startProgressiveDetail();       // 后台渐进细化：让树图从粗到细自己长出来
    if (window.__GEOM) setTimeout(() => window.__dumpGeom(), 300);
    if (window.__DRIFT) setTimeout(() => window.__drift(), 400);
    if (window.__COLS) setTimeout(() => window.__cols(), 350);
    if (window.__PNG) setTimeout(() => window.__dumpPng(), 500);
    const st = (payload && payload.stats) || {};
    document.getElementById("st0").textContent =
      `扫描完成 · ${payload.mode ? "MFT 直读" : "普通遍历"} · ${nodeFullPath(root) || ""} · ${fmtCount(st.items || 0)} 项`;
  },
  setProgress(items, bytes) {
    // 0/0 视为「复位」（宿主用它表示清空进度），不要当成扫描中
    if (!items && !bytes) {
      const w0 = document.getElementById("progWrap");
      if (w0) w0.style.display = "none";
      return;
    }
    // 扫描已完成后的迟到 progress（宿主可能在 SCAN DONE 之后还发一条）要忽略，
    // 否则会把按钮又切回「停止」、进度条又冒出来（踩过：一直显示"扫描中"）。
    if (Date.now() - _lastTreeAt < 600) return;

    // 记录起点，用于算速度/耗时
    if (!_scanT0) { _scanT0 = Date.now(); _scanBytes0 = bytes; _scanItems0 = items; }
    const dt = Math.max(0.2, (Date.now() - _scanT0) / 1000);
    const itemRate = ((items - _scanItems0) / dt);
    const byteRate = (bytes - _scanBytes0) / dt;

    document.getElementById("st0").textContent = "扫描中…";
    if (typeof setScanState === "function") setScanState(true);
    const w = document.getElementById("progWrap");
    if (w) {
      w.style.display = "flex";
      document.getElementById("progTxt").textContent =
        `${fmtCount(items)} 项 · ${fmtSize(bytes)} · ` +
        `${fmtCount(Math.round(itemRate))} 项/s · ${fmtSize(Math.round(byteRate))}/s`;
    }
  },
  // 诊断通道：显示宿主收到的原始消息
  __hostEcho(json) {
    try {
      const o = typeof json === "string" ? JSON.parse(json) : json;
      document.getElementById("st1").textContent = "宿主收到: " + o.cmd;
    } catch (e) {
      document.getElementById("st1").textContent = "宿主收到(原始): " + json;
    }
  },
};

// 启动：先恢复列宽/分栏偏好，再首渲染
loadColPrefs();
applySplit();
render();
</script>
</body>
</html>
